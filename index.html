<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MR DYAF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000; --card:#111; --line:#2a2a2a; --text:#fff; --muted:#b5b5b5;
  --gold:#E8A91D; --red:#D62828;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;
  background-image:radial-gradient(circle at 50% 0%,#2a1208 0,#000 55%);min-height:100vh}
.wrap{max-width:440px;margin:0 auto;padding:28px 20px 40px;text-align:center}
.logo{width:200px;max-width:70%;border-radius:20px}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-size:2rem;margin:18px 0 4px;letter-spacing:.04em}
.role{color:var(--gold);font-size:.8rem;letter-spacing:.25em;text-transform:uppercase;margin:0}
.divider{display:flex;align-items:center;gap:10px;justify-content:center;margin:22px 0}
.divider::before,.divider::after{content:"";height:1px;width:70px;background:var(--gold)}
.ico svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.ico{color:var(--gold)}
/* ===== Chaque bouton = un bloc <a class="btn"> ... supprime-le pour l’enlever, copie-le pour en ajouter ===== */
.btn{display:flex;align-items:center;gap:14px;text-align:left;text-decoration:none;color:var(--text);
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;
  transition:transform .15s,border-color .15s}
.btn:hover,.btn:active{transform:translateY(-2px);border-color:var(--gold)}
.ico{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:1.2rem;background:#1d1d1d;flex:none}
.btn small{display:block;color:var(--muted);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase}
.btn span{font-weight:500;font-size:.95rem;word-break:break-all}

footer{margin-top:26px;color:var(--muted);font-size:.75rem}

/* ===== Animations ===== */
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes flicker{0%,100%{transform:scale(1) rotate(-2deg)}30%{transform:scale(1.15,1.28) rotate(2deg)}60%{transform:scale(.95,1.1) rotate(-1deg)}}
@keyframes glow{0%,100%{box-shadow:0 0 28px rgba(214,40,40,.15)}50%{box-shadow:0 0 52px rgba(232,169,29,.32)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.logo{animation:rise .8s backwards,glow 4s ease-in-out 1s infinite}
h1{animation:rise .8s .15s backwards}
.role{animation:rise .8s .3s backwards}
.divider svg{transform-origin:50% 90%;animation:flicker 1.6s ease-in-out infinite}
.divider::before,.divider::after{animation:grow .9s .5s backwards}
.divider::before{transform-origin:right}
.divider::after{transform-origin:left}
.btn{animation:rise .6s var(--d,.6s) backwards}
.btn:nth-of-type(1){--d:.6s}
.btn:nth-of-type(2){--d:.72s}
.btn:nth-of-type(3){--d:.84s}
.btn:nth-of-type(4){--d:.96s}
.btn:nth-of-type(5){--d:1.08s}
.btn:nth-of-type(6){--d:1.2s}
.btn:nth-of-type(7){--d:1.32s}
.ico{transition:background .2s,color .2s}
.btn:hover .ico{background:var(--gold);color:#000}
footer{animation:rise .8s 1.3s backwards}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
